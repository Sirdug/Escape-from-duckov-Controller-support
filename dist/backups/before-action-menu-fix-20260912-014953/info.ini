name = DuckovPad
displayName = DuckovPad - Full Controller Support
description = Full\ gamepad\ support\ for\ Escape\ from\ Duckov\.\ The\ game\ ships\ with\ no\ gamepad\ bindings\ at\ all,\ so\ this\ adds\ the\ whole\ pad\ layer:\ aiming,\ on-foot\ actions,\ menu\ and\ inventory\ navigation,\ button\ prompts,\ rumble,\ and\ a\ Controller\ settings\ tab\ built\ from\ the\ game's\ own\ options\ widgets\.\n\n\[b]Aiming\[/b]\nPoint\ the\ right\ stick\ where\ you\ want\ to\ shoot\.\ The\ crosshair\ rides\ a\ circle\ measured\ in\ screen\ pixels,\ so\ it\ sweeps\ at\ the\ same\ speed\ in\ every\ direction\ instead\ of\ slowing\ down\ and\ pulling\ in\ near\ the\ top\ and\ bottom\ of\ the\ screen\.\ Full\ deflection\ means\ "point\ there";\ easing\ off\ the\ stick\ slows\ the\ turn\ for\ fine\ adjustment\.\n\n\[b]Aim\ assist\[/b]\nTwo\ separate\ halves\ you\ can\ tune\ independently\.\ Friction\ quietly\ slows\ your\ turn\ rate\ near\ an\ enemy\ and\ never\ moves\ your\ aim\ for\ you\.\ A\ small\ capped\ pull\ tracks\ a\ strafing\ target\ on\ top\ of\ that\.\ Both\ step\ aside\ during\ a\ deliberate\ flick,\ so\ sweeping\ across\ a\ room\ does\ not\ drag\.\n\n\[b]Lock-on\[/b]\nClick\ R3\ to\ lock\ onto\ an\ enemy\.\ The\ crosshair\ travels\ onto\ the\ target\ and\ hands\ control\ back\ smoothly,\ the\ locked\ enemy\ is\ drawn\ with\ a\ white\ outline,\ light\ stick\ pressure\ leads\ movers,\ and\ a\ hard\ flick\ switches\ target\.\n\n\[b]Menus\[/b]\nThe\ stick\ and\ D-pad\ move\ a\ persistent\ highlight\ between\ buttons,\ equipment\ and\ inventory\ slots\.\ A\ selects\ and\ places,\ X\ opens\ item\ actions,\ Y\ quick-moves,\ B\ goes\ back\.\ A\ contextual\ prompt\ bar\ shows\ what\ every\ button\ does,\ and\ holding\ LB\ turns\ it\ into\ a\ cheat-sheet\ for\ the\ modifier\ layer\.\n\n\[b]Steam\ Deck\[/b]\nWorks\ through\ Steam\ Input\.\ Trackpad\ and\ gyro\ mouse\ aiming\ can\ run\ alongside\ stick\ and\ trigger\ input,\ and\ all\ four\ rear\ buttons\ can\ be\ mapped\ separately\.\ See\ SteamDeckSetup\.md\ inside\ the\ mod\ folder\ for\ the\ layout\.\n\n\[b]Notes\[/b]\nEverything\ is\ configurable\ in\ Options\ -\ Controller,\ including\ full\ button\ remapping\.\ Keyboard\ and\ mouse\ keep\ working;\ F5\ toggles\ the\ pad\ off\ and\ on\.\ Disable\ the\ other\ "Controller\ Support"\ mod\ if\ you\ have\ it,\ since\ both\ replace\ the\ same\ input\ handler\.
